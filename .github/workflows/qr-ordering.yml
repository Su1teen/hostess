name: QR ordering checks
on:
  pull_request:
  push:
    branches: [main, codex/qr-table-ordering]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref != 'codex/qr-table-ordering'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install isolated UI test dependency
        run: npx playwright install --with-deps chromium webkit
      - name: Android Chrome fixtures
        run: node tests/dine-in.browser.mjs
      - name: Desktop Chrome fixtures
        run: BROWSER_DEVICE=desktop node tests/dine-in.browser.mjs
      - name: iOS WebKit fixtures
        run: BROWSER_ENGINE=webkit node tests/dine-in.browser.mjs
